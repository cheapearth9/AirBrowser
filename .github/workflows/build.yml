name: Build AirBrowser Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project AirBrowser.xcodeproj \
            -scheme AirBrowser \
            -destination 'generic/platform=iOS' \
            -archivePath build/AirBrowser.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA File
        run: |
          mkdir -p Payload
          cp -R build/AirBrowser.xcarchive/Products/Applications/*.app Payload/
          zip -r AirBrowser.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBrowser-Unsigned-IPA
          path: AirBrowser.ipa
