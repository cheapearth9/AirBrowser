name: Build AirBrowser Unsigned IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project AirBrowser.xcodeproj \
            -scheme AirBrowser \
            -destination 'generic/platform=iOS' \
            -archivePath build/AirBrowser.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA File
        run: |
          mkdir -p Payload
          cp -R build/AirBrowser.xcarchive/Products/Applications/*.app Payload/
          zip -r AirBrowser.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBrowser-Unsigned-IPA
          path: AirBrowser.ipa
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" AirBrowser/Info.plist)
          TAG="v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" AirBrowser.ipa \
            --title "AirBrowser $VERSION (build ${{ github.run_number }})" \
            --notes "Automatic build of commit ${{ github.sha }}. Unsigned IPA: sideload it with AltStore, SideStore, LiveContainer, etc." \
            --target "${{ github.sha }}"


      - name: Publish the IPA as a release (for the AltStore source)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --title "AirBrowser (latest)" --notes "Build ${{ github.run_number }}"
          gh release edit ios-latest --notes "Build ${{ github.run_number }}"
          gh release upload ios-latest AirBrowser.ipa --clobber
